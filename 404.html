  <style>
    :root {
      --canvas: #1c1f1a;
      --canvas-fg-strong: #ece9e2;
      --canvas-fg: #b8b5ad;
      --accent: #3a6b4a;
      --serif: Georgia, 'Times New Roman', Times, serif;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--canvas);
      color: var(--canvas-fg-strong);
      font-family: var(--serif);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    main {
      padding: 24px;
      max-width: 480px;
    }
    h1 {
      font-size: 56px;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin: 0 0 16px;
      line-height: 1;
    }
    p {
      font-style: italic;
      color: var(--canvas-fg);
      font-size: 16px;
      line-height: 1.5;
      margin: 0 0 32px;
    }
    a {
      font-style: italic;
      font-size: 14px;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 160ms ease;
    }
    a:hover { border-bottom-color: var(--accent); }
  </style>
  <script>
    // Smart redirect: legacy URL slugs → canonical pillar URL.
    // Comparison is case-insensitive and trailing-slash-insensitive
    // so /Long-Form, /RESUME/, /Photography all funnel correctly.
    // For any other 404, fall through to the static "page not found"
    // UI below.
    (function () {
      var slug = location.pathname.replace(/\/+$/, '').toLowerCase();
      var legacyMap = {
        '/long-form':   '/builder/',
        '/resume':      '/builder/',
        '/dossier':     '/builder/',
        '/about':       '/builder/',
        '/work':        '/builder/',
        '/photography': '/photographer/'
      };
      var target = legacyMap[slug];
      if (target) {
        location.replace(target + location.search + location.hash);
      }
    })();
  </script>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>The page you're looking for doesn't exist.<br/>Maybe it never did.</p>
    <a href="/">← back to splash</a>
  </main>
</body>
