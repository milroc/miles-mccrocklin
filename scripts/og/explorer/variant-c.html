<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG / Explorer / Variant C — Planetarium plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  html, body { margin: 0; padding: 0; background: #1c1f1a; }
  body { font-family: Georgia, "Times New Roman", Times, serif; -webkit-font-smoothing: antialiased; }
  .og {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: #1c1f1a;
    color: #fdfdfb;
  }
  /* Plate registration marks — top + bottom rules anchor the type, like a chart. */
  .top-rule, .bot-rule {
    position: absolute; left: 64px; right: 64px;
    height: 1px; background: rgba(236, 233, 226, 0.18);
    z-index: 3;
  }
  .top-rule { top: 64px; }
  .bot-rule { bottom: 64px; }

  /* Globe centered, kept small enough that the rings + type breathe around it. */
  .stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }
  .globe-frame {
    position: relative;
    width: 460px; height: 460px;
  }
  .globe-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    background-image: url('./globe-hero.png');
    background-size: 700px auto;
    background-position: center center;
    background-repeat: no-repeat;
    border-radius: 50%;
  }
  /* Two thin cream rings — meridian (outer) + tighter inner — like an
     astronomical/nautical chart plate. */
  .ring-outer {
    position: absolute; inset: -28px;
    border: 1px solid rgba(236, 233, 226, 0.22);
    border-radius: 50%;
  }
  .ring-inner {
    position: absolute; inset: 6px;
    border: 1px solid rgba(236, 233, 226, 0.10);
    border-radius: 50%;
  }
  /* Tick marks at N/E/S/W (the only color personality on the plate). */
  .tick {
    position: absolute; left: 50%; top: 50%;
    width: 1.5px; height: 18px;
    background: #3a6b4a;
    transform-origin: 50% -250px;
    margin: -9px 0 0 -0.75px;
  }
  .tick.n { transform: rotate(0deg); }
  .tick.e { transform: rotate(90deg); }
  .tick.s { transform: rotate(180deg); }
  .tick.w { transform: rotate(270deg); }

  /* Type: top eyebrow + bottom italic display, both centered. */
  .header {
    position: absolute; left: 0; right: 0; top: 92px;
    text-align: center; z-index: 2;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 500; font-size: 13px; letter-spacing: 0.42em;
    color: #b8b5ad; text-transform: uppercase;
    margin: 0;
  }
  .footer {
    position: absolute; left: 0; right: 0; bottom: 92px;
    text-align: center; z-index: 2;
  }
  .display {
    font-style: italic; font-weight: 400;
    font-size: 40px; line-height: 1.15; letter-spacing: -0.005em;
    margin: 0;
    color: #fdfdfb;
  }
  .metric {
    margin-top: 12px;
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 400; font-size: 12px; letter-spacing: 0.30em;
    color: #b8b5ad; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  .metric .num { color: #fdfdfb; font-weight: 500; }
</style>
</head>
<body>
<div class="og">
  <div class="top-rule"></div>
  <div class="bot-rule"></div>

  <div class="header">
    <p class="eyebrow">Miles McCrocklin <span style="margin:0 16px; color:#7a7770;">/</span> Explorer</p>
  </div>

  <div class="stage">
    <div class="globe-frame">
      <div class="ring-outer"></div>
      <div class="globe-img"></div>
      <div class="ring-inner"></div>
      <span class="tick n"></span>
      <span class="tick e"></span>
      <span class="tick s"></span>
      <span class="tick w"></span>
    </div>
  </div>

  <div class="footer">
    <p class="display">Every country I've been to.</p>
    <p class="metric"><span class="num">59</span> Countries <span style="color:#7a7770;margin:0 10px;">·</span> <span class="num">6</span> Continents</p>
  </div>
</div>
<script>
  Promise.all([document.fonts.ready])
    .then(() => document.documentElement.setAttribute('data-fonts','ready'));
</script>
</body>
</html>
